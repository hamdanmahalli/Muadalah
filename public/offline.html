<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline - SmartPesantren</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .box { max-width: 360px; width: 100%; }
        .ikona {
            width: 88px; height: 88px;
            margin: 0 auto 22px;
            border-radius: 28px;
            background: linear-gradient(135deg, #10b981, #0d9488);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 30px rgba(16,185,129,0.35);
        }
        .ikona svg { width: 44px; height: 44px; stroke: #fff; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #0f172a; }
        p { font-size: 14px; line-height: 1.6; color: #64748b; margin-bottom: 26px; }
        button {
            border: none; cursor: pointer;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #10b981;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(16,185,129,0.3);
            transition: transform .15s ease, background .2s ease;
        }
        button:active { transform: scale(0.97); }
        button:hover { background: #059669; }
        .hint { margin-top: 16px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="box">
        <div class="ikona">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Tidak ada koneksi internet. Menunggu cache tersedia atau sambungan kembali agar aplikasi dapat digunakan.</p>
        <button id="btn-coba" type="button">Coba Lagi</button>
        <p class="hint">Aplikasi SmartPesantren menyimpan beberapa halaman untuk dibuka tanpa internet.</p>
    </div>
    <script>
        document.getElementById('btn-coba').addEventListener('click', function () {
            if (navigator.onLine) {
                location.reload();
            } else {
                this.textContent = 'Masih offline, tunggu koneksi...';
                var self = this;
                window.addEventListener('online', function () {
                    location.reload();
                }, { once: true });
                setTimeout(function () { self.textContent = 'Coba Lagi'; }, 2500);
            }
        });
    </script>
</body>
</html>
